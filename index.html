<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eddy a Punta Ala</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0e2a3a;
    color:#fff;
    font-family:"Trebuchet MS","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  #wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
  h1{
    font-size:24px;letter-spacing:2px;color:#ffe14d;
    text-shadow:2px 2px 0 #c0392b,4px 4px 0 rgba(0,0,0,.3);
  }
  #hud{
    width:900px;max-width:94vw;display:flex;justify-content:space-between;align-items:center;
    font-size:15px;font-weight:bold;letter-spacing:1px;color:#eafff5;
  }
  #hud .pill{
    background:rgba(0,0,0,.35);border:2px solid #ffe14d;border-radius:20px;
    padding:4px 14px;
  }
  #hud b{color:#ffe14d}
  #hud .mute{
    cursor:pointer;font-size:16px;line-height:1;
    font-family:inherit;color:#eafff5;
    transition:transform .1s;
  }
  #hud .mute:hover{transform:scale(1.12);border-color:#fff}
  #hud .mute:active{transform:scale(.95)}
  #stage{
    position:relative;width:900px;max-width:94vw;
    border:4px solid #2e7d32;border-radius:10px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#8fd3ff}
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-align:center;
    background:rgba(8,30,42,.78);backdrop-filter:blur(2px);
  }
  #overlay.hidden{display:none}
  #overlay .big{font-size:30px;color:#ffe14d;text-shadow:2px 2px 0 #c0392b}
  #overlay .sub{font-size:15px;color:#dff}
  #overlay .blink{animation:blink 1s steps(2) infinite}
  #overlay .levels{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;justify-content:center}
  #overlay .lvlbtn{
    cursor:pointer;background:rgba(0,0,0,.3);border:2px solid #58d68d;border-radius:10px;
    color:#eafff5;font-family:inherit;font-size:15px;font-weight:bold;
    padding:10px 18px;min-width:150px;transition:transform .1s,border-color .1s;
  }
  #overlay .lvlbtn:hover{transform:scale(1.05);border-color:#ffe14d}
  #overlay .lvlbtn:active{transform:scale(.97)}
  #overlay .lvlbtn small{display:block;font-weight:normal;font-size:12px;color:#bfe;margin-top:3px}
  @keyframes blink{50%{opacity:.25}}
  .legend{font-size:12px;color:#9fd3c7;letter-spacing:.5px;text-align:center;line-height:1.6}
  kbd{background:#1d3b2a;border:1px solid #58d68d;border-radius:4px;padding:1px 7px;color:#c8ffdd}
</style>
</head>
<body>
<div id="wrap">
  <h1>🐿️ EDDY a PUNTA ALA</h1>
  <div id="hud">
    <div class="pill">🌰 Tesori <b id="treasureTxt">0 / 0</b></div>
    <div class="pill" id="levelTxt">LIV 1</div>
    <div class="pill" id="zoneTxt">PINETA</div>
    <div class="pill">⭐ Punti <b id="scoreTxt">0</b></div>
    <button id="muteBtn" class="pill mute" title="Audio on/off (M)">🔊</button>
  </div>
  <div id="stage">
    <canvas id="game" width="900" height="420"></canvas>
    <div id="overlay"></div>
  </div>
  <div class="legend">
    <kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd> muoviti &nbsp;·&nbsp;
    <kbd>SPAZIO</kbd>/<kbd>↑</kbd> salta &nbsp;·&nbsp;
    <kbd>↑</kbd>/<kbd>↓</kbd> arrampicati/nasconditi nei cespugli &nbsp;·&nbsp;
    <kbd>R</kbd> ricomincia &nbsp;·&nbsp;
    <kbd>M</kbd> audio &nbsp;·&nbsp;
    <kbd>ESC</kbd> menu
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
